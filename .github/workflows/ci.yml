name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python-tests:
    name: Python tests (data + golden predictions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install numpy opencv-python-headless ai-edge-litert pytest
      - name: Run pytest
        run: pytest tests/ -v

  web-smoke:
    name: Browser demo smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run smoke test
        run: node tests/web_smoke.mjs
