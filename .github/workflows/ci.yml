name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tooling
        # PyQt5 is installed so mypy sees the same stubs locally and in CI.
        run: pip install ruff mypy numpy PyQt5
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy *.py training/ tools/

  python-tests:
    name: Python tests (data, golden, parity, quality)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install numpy opencv-python-headless ai-edge-litert onnxruntime pytest
      - name: Generate out-of-distribution negatives
        run: python3 tests/make_negatives.py
      - name: Run pytest
        run: pytest tests/ -v

  js-unit-tests:
    name: JS unit tests (quality, i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Run node:test
        run: node --test tests/js/*.test.mjs

  web-smoke:
    name: Browser demo smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run smoke test
        run: node tests/web_smoke.mjs

  lighthouse:
    name: Lighthouse CI (performance, a11y, SEO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouserc.json
